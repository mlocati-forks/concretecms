name: "PHPUnit"

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  phpunit:
    name: "PHPUnit"
    outputs:
      code-coverage: "${{ steps.enable-code-coverage.outputs.enabled }}"
    env:
      LC_ALL: en_US.UTF-8
      CODE_COVERAGE_TOOL: none
      PHPUNIT_ARGS: ''

    runs-on: ${{ matrix.operating-system }}
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ccm_tests
        ports:
          - 3306:3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      matrix:
        php-version:
          - "7.3"
          - "7.4"
          - "8.0"
        dependencies:
          - "locked"
        operating-system:
          - "ubuntu-latest"
        composer:
          - "composer:v2"

        include:
          - php-version: 8.1
            operating-system: "ubuntu-latest"
            dependencies: "highest"
          - php-version: 7.3
            operating-system: "ubuntu-latest"
            dependencies: "locked"
          - php-version: 8.1
            operating-system: "ubuntu-latest"
            dependencies: "locked"
          - php-version: 8.2
            operating-system: "ubuntu-latest"
            dependencies: "locked"
            code-coverage: "1"
          - php-version: 8.5
            operating-system: "ubuntu-latest"
            dependencies: "highest"

    steps:
      - name: Enable code coverage
        id: enable-code-coverage
        if: matrix.code-coverage && github.repository_owner == 'mlocati-forks'
        run: |
          echo "CODE_COVERAGE_TOOL=pcov" >> "$GITHUB_ENV"
          echo "PHPUNIT_ARGS=--coverage-clover coverage.xml" >> "$GITHUB_ENV"
          echo "enabled=1" >> "$GITHUB_OUTPUT"

      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysql
          coverage: ${{ env.CODE_COVERAGE_TOOL }}
          ini-values: memory_limit=-1, pcov.directory=concrete, pcov.exclude="~(vendor|tests|js|css|config)~"
          tools: ${{matrix.composer}}

      - name: "Get Composer cache directory"
        id: composer-cache-dir
        shell: bash
        run: echo "dir=$(composer config --global --no-interaction cache-files-dir)" >>"$GITHUB_OUTPUT"

      - name: "Cache Composer downloads"
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php-version }}-${{ matrix.dependencies }}-

      - name: "Prepare mysql user"
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE USER 'ccm_test'@'%' IDENTIFIED BY '';"
          mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'ccm_test'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: |
          composer update --prefer-lowest --no-interaction --no-progress
          # Run twice for mediawiki merge
          composer update --prefer-lowest --no-interaction --no-progress

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: |
          echo "CCM_TEST_SKIP_CHECKCOMPOSERPLATFORM=1" >>"$GITHUB_ENV"
          composer config --unset platform.php
          composer update --no-interaction --no-progress

      - name: "Install locked dependencies"
        if: ${{ matrix.dependencies == 'locked' }}
        run: |
          composer install --no-interaction --no-progress

      - name: "Tests"
        run: php ./concrete/vendor/phpunit/phpunit/phpunit --colors=always ${{ env.PHPUNIT_ARGS }}

      - name: Send coverage to Coveralls
        if: env.CODE_COVERAGE_TOOL != 'none'
        uses: coverallsapp/github-action@v2
        with:
          flag-name: run-${{ join(matrix.*, '-') }}
          file: coverage.xml
          parallel: true

  coveralls-finish:
    name: Finish Coveralls
    needs: phpunit
    if: needs.phpunit.outputs.code-coverage == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
